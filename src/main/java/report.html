<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Library Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            margin:40px;
            background:#f4f4f4;
        }

        h1{
            text-align:center;
        }

        h2{
            text-align:center;
        }

        .section{
            background:white;
            padding:20px;
            margin-bottom:30px;
            border-radius:10px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:15px;
        }

        th,td{
            border:1px solid #cccccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#eeeeee;
        }

        canvas{
            max-width:700px;
            margin:auto;
            display:block;
        }

    </style>

</head>

<body>

<h1>Library Dashboard</h1>
<p><b>Total Users:</b> 0</p><p><b>Total Items:</b> 0</p><div class="section">

<h2>Library Resources Overview</h2>

<table>

    <tr>
        <th>Books</th>
        <th>Magazines</th>
        <th>Ebooks</th>
        <th>AudioBooks</th>
    </tr>

    <tr>
<td>0</td><td>0</td><td>0</td><td>0</td>    </tr>

</table>

<canvas id="resourceChart"></canvas>

</div>
<div class="section">

<h2>Category Distribution</h2>

<table>

    <tr>
        <th>Category</th>
        <th>Count</th>
    </tr>
</table>

<canvas id="categoryChart"></canvas>

</div>
<div class="section">

<h2>User Role Distribution</h2>

<table>

    <tr>
        <th>Students</th>
        <th>Faculty</th>
        <th>Guests</th>
    </tr>

    <tr>
<td>0</td><td>0</td><td>0</td>    </tr>

</table>

<canvas id="roleChart"></canvas>

</div>
<script>

new Chart(
    document.getElementById('resourceChart'),
    {
        type:'pie',
        data:{
            labels:[
                'Books',
                'Magazines',
                'Ebooks',
                'AudioBooks'
            ],
            datasets:[{
                data:[
0,0,0,0                ]
            }]
        }
    }
);

new Chart(
    document.getElementById('categoryChart'),
    {
        type:'bar',
        data:{
            labels:[
            ],
            datasets:[{
                label:'Items',
                data:[
                ]
            }]
        }
    }
);

new Chart(
    document.getElementById('roleChart'),
    {
        type:'doughnut',
        data:{
            labels:[
                'Students',
                'Faculty',
                'Guests'
            ],
            datasets:[{
                data:[
0,0,0                ]
            }]
        }
    }
);

</script>

</body>
</html>
